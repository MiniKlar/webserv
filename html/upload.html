<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .gallery img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border: 2px solid #ccc;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .gallery img:hover {
      transform: scale(1.05);
      border-color: #666;
    }
    #preview {
      max-width: 400px;
      border: 2px solid #4CAF50;
      border-radius: 8px;
      margin-top: 10px;
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.9);
    }
    .modal-content {
      margin: auto;
      display: block;
      max-width: 90%;
      max-height: 90%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .close {
      position: absolute;
      top: 15px;
      right: 35px;
      color: #f1f1f1;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>Envoyer une image</h1>
<p><a href="index.html">Retour à l'accueil</a></p>

<form action="/upload" method="post" enctype="multipart/form-data">
  <label for="imageInput">Choisir une image :</label>
  <input id="imageInput" type="file" name="image" accept="image/*" required>
  <button type="submit">Envoyer au serveur</button>
</form>

<h2>Aperçu du fichier sélectionné</h2>
<img id="preview" alt="Aperçu de l'image" style="display: none;">

<h2>Images disponibles dans le dossier drive</h2>
<div id="gallery" class="gallery"></div>
<p id="galleryStatus" style="color: #666;"></p>

<div id="imageModal" class="modal">
  <span class="close">&times;</span>
  <img class="modal-content" id="modalImage">
</div>

<script>
  const imageInput = document.getElementById('imageInput');
  const preview = document.getElementById('preview');
  const gallery = document.getElementById('gallery');
  const galleryStatus = document.getElementById('galleryStatus');
  const modal = document.getElementById('imageModal');
  const modalImage = document.getElementById('modalImage');
  const closeModal = document.querySelector('.close');

  // Aperçu du fichier à uploader
  imageInput.addEventListener('change', function () {
    const file = this.files && this.files[0];
    if (!file) {
      preview.style.display = 'none';
      preview.removeAttribute('src');
      return;
    }
    preview.src = URL.createObjectURL(file);
    preview.style.display = 'block';
  });

  // Charger les 3 images PNG du dossier drive
  async function loadGallery() {
    galleryStatus.textContent = 'Chargement des images...';

    const images = [];
    const expectedNames = ['image1.png', 'image2.png', 'image3.png'];

    // Chercher uniquement les 3 images spécifiques
    for (const name of expectedNames) {
      const path = `/drive/${name}`;
      try {
        const response = await fetch(path, { method: 'HEAD' });
        if (response.ok) {
          images.push(path);
        }
      } catch (e) {
        // Fichier n'existe pas
      }
    }

    if (images.length === 0) {
      galleryStatus.innerHTML = `Aucune image trouvée.<br/>
        <strong>Noms attendus :</strong> image1.png, image2.png, image3.png<br/>
        <strong>Dossier :</strong> /drive/`;
      return;
    }

    galleryStatus.textContent = `${images.length}/3 image(s) trouvée(s)`;

    images.forEach(path => {
      const img = document.createElement('img');
      img.src = path;
      img.alt = path.split('/').pop();
      img.title = 'Cliquer pour agrandir';
      img.onclick = () => openModal(path);
      gallery.appendChild(img);
    });
  }

  function openModal(imagePath) {
    modal.style.display = 'block';
    modalImage.src = imagePath;
  }

  closeModal.onclick = () => {
    modal.style.display = 'none';
  };

  modal.onclick = (e) => {
    if (e.target === modal) {
      modal.style.display = 'none';
    }
  };

  // Charger la galerie au démarrage
  loadGallery();
</script>

</body>
</html>
