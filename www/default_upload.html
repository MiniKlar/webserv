<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Image</title>
  <style>
    :root {
      --bg-top: #fff7ed;
      --bg-bottom: #ffedd5;
      --card: #ffffff;
      --text: #1c1917;
      --muted: #57534e;
      --accent: #ea580c;
      --accent-strong: #c2410c;
      --border: #fdba74;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .panel {
      width: min(680px, 100%);
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 18px 32px rgba(120, 53, 15, 0.15);
      padding: 24px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(1.5rem, 4vw, 2rem);
    }

    p {
      margin: 0 0 16px;
      color: var(--muted);
    }

    form {
      display: grid;
      gap: 12px;
      margin-bottom: 20px;
    }

    label {
      font-weight: 700;
    }

    input[type="file"] {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      background: #fff;
    }

    button {
      width: fit-content;
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: var(--accent-strong);
    }

    .links {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 10px;
    }

    .links a {
      display: inline-block;
      color: var(--accent-strong);
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
      font-weight: 700;
    }

    .links a:hover {
      color: #9a3412;
    }

    .links li {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .delete-btn {
      padding: 6px 10px;
      background: #ef4444;
      font-size: 0.8rem;
    }

    .delete-btn:hover {
      background: #b91c1c;
    }

    #preview {
      display: none;
      width: min(100%, 280px);
      margin-top: 8px;
      border-radius: 10px;
      border: 2px solid var(--border);
      object-fit: cover;
    }

    .auth-box {
      background: #ffedd5;
      border: 1px solid var(--border);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .auth-box p {
      margin-top: 0;
      color: var(--accent-strong);
      font-size: 0.95rem;
    }

    #cookieMsg {
      margin-left: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Uploader une image</h1>

    <div class="auth-box">
      <p><strong>Note :</strong> L'authentification par session (bonus) est active. Vous devez récupérer un cookie d'autorisation via la route <code>/get-cookie</code> avant de pouvoir envoyer ou supprimer des images.</p>
      <button type="button" id="cookieBtn">Récupérer le cookie</button>
      <span id="cookieMsg"></span>
    </div>

    <p>Selectionne une image puis clique sur envoyer.</p>

    <form action="/uploads/" method="post" enctype="multipart/form-data">
      <label for="imageInput">Image</label>
      <input id="imageInput" type="file" name="image" accept="image/*" required>
      <button type="submit">Envoyer</button>
      <img id="preview" alt="Apercu de l'image">
    </form>

    <h2>Liens rapides</h2>
    <ul class="links">
      <li>
        <a href="/uploads/image0.png">image0</a>
        <button type="button" class="delete-btn" data-url="/uploads/image0.png">Supprimer</button>
      </li>
      <li>
        <a href="/uploads/image1.png">image1</a>
        <button type="button" class="delete-btn" data-url="/uploads/image1.png">Supprimer</button>
      </li>
      <li>
        <a href="/uploads/image2.png">image2</a>
        <button type="button" class="delete-btn" data-url="/uploads/image2.png">Supprimer</button>
      </li>
    </ul>
  </main>

  <script>
    const cookieBtn = document.getElementById('cookieBtn');
    const cookieMsg = document.getElementById('cookieMsg');

    cookieBtn.addEventListener('click', async () => {
      try {
        const response = await fetch('/get-cookie');
        if (response.ok) {
          cookieMsg.textContent = '✅ Cookie obtenu avec succès !';
          cookieMsg.style.color = 'green';
        } else {
          cookieMsg.textContent = '❌ Erreur de récupération du cookie.';
          cookieMsg.style.color = 'red';
        }
        setTimeout(() => cookieMsg.textContent = '', 3000);
      } catch (error) {
        console.error('Erreur:', error);
        cookieMsg.textContent = '❌ Erreur réseau.';
        cookieMsg.style.color = 'red';
      }
    });

    const input = document.getElementById('imageInput');
    const preview = document.getElementById('preview');

    input.addEventListener('change', () => {
      const file = input.files && input.files[0];
      if (!file) {
        preview.style.display = 'none';
        preview.removeAttribute('src');
        return;
      }

      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
    });

    document.querySelectorAll('.delete-btn').forEach(button => {
      button.addEventListener('click', async (e) => {
        const url = e.target.getAttribute('data-url');
        if (confirm(`Voulez-vous vraiment supprimer ${url} ?`)) {
          try {
            const response = await fetch(url, { method: 'DELETE' });
            if (response.ok || response.status === 204) {
              console.log('Suppression réussie pour', url);
            } else {
              const errorHtml = await response.text();
              document.open();
              document.write(errorHtml);
              document.close();
            }
          } catch (error) {
            console.error('Erreur:', error);
            alert('Une erreur s\'est produite lors de la requête DELETE.');
          }
        }
      });
    });
  </script>
</body>
</html>
