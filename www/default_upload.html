<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Image</title>
  <style>
    :root {
      --bg-top: #fff7ed;
      --bg-bottom: #ffedd5;
      --card: #ffffff;
      --text: #1c1917;
      --muted: #57534e;
      --accent: #ea580c;
      --accent-strong: #c2410c;
      --border: #fdba74;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .panel {
      width: min(680px, 100%);
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 18px 32px rgba(120, 53, 15, 0.15);
      padding: 24px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(1.5rem, 4vw, 2rem);
    }

    p {
      margin: 0 0 16px;
      color: var(--muted);
    }

    form {
      display: grid;
      gap: 12px;
      margin-bottom: 20px;
    }

    label {
      font-weight: 700;
    }

    input[type="file"] {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      background: #fff;
    }

    button {
      width: fit-content;
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: var(--accent-strong);
    }

    .links {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 10px;
    }

    .links a {
      display: inline-block;
      color: var(--accent-strong);
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
      font-weight: 700;
    }

    .links a:hover {
      color: #9a3412;
    }

    #preview {
      display: none;
      width: min(100%, 280px);
      margin-top: 8px;
      border-radius: 10px;
      border: 2px solid var(--border);
      object-fit: cover;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Uploader une image</h1>
    <p>Selectionne une image puis clique sur envoyer.</p>

    <form action="/default_upload" method="post" enctype="multipart/form-data">
      <label for="imageInput">Image</label>
      <input id="imageInput" type="file" name="image" accept="image/*" required>
      <button type="submit">Envoyer</button>
      <img id="preview" alt="Apercu de l'image">
    </form>

    <h2>Liens rapides</h2>
    <ul class="links">
      <li><a href="/uploads/image0.png">image0</a></li>
      <li><a href="/uploads/image1.png">image1</a></li>
      <li><a href="/uploads/image2.png">image2</a></li>
    </ul>
  </main>

  <script>
    const input = document.getElementById('imageInput');
    const preview = document.getElementById('preview');

    input.addEventListener('change', () => {
      const file = input.files && input.files[0];
      if (!file) {
        preview.style.display = 'none';
        preview.removeAttribute('src');
        return;
      }

      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
    });
  </script>
</body>
</html>
