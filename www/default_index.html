<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accueil</title>
  <style>
    :root {
      --bg-top: #050510;
      --bg-bottom: #1a1025;
      --card: #15162c;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #8b5cf6;
      --accent-strong: #a78bfa;
      --border: #2e1065;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .panel {
      width: min(680px, 100%);
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 18px 32px rgba(120, 53, 15, 0.15);
      padding: 24px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(1.5rem, 4vw, 2rem);
    }

    p {
      margin: 0 0 16px;
      color: var(--muted);
    }

    a {
      color: var(--accent-strong);
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
      font-weight: 700;
    }

    a:hover {
      color: #9a3412;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>My First Heading</h1>
    <p>Hello World</p>
    <p><a href="default_upload.html">Aller vers la page d'envoi d'image</a></p>
    <p><a href="test_cgi.html">Tester les requêtes CGI (GET et POST)</a></p>
  </main>
</body>
</html>
