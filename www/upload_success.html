<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Succès</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      padding: 40px;
      max-width: 500px;
      text-align: center;
    }
    .success-icon {
      width: 80px;
      height: 80px;
      background: #4CAF50;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 20px;
      font-size: 48px;
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 2em;
    }
    .message {
      color: #666;
      font-size: 1.1em;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    .file-info {
      background: #f5f5f5;
      border-left: 4px solid #4CAF50;
      padding: 15px;
      margin-bottom: 30px;
      text-align: left;
      border-radius: 4px;
    }
    .file-info p {
      color: #555;
      font-size: 0.95em;
      margin: 8px 0;
    }
    .file-info strong {
      color: #333;
    }
    .buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button, a.button {
      padding: 12px 30px;
      font-size: 1em;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
      display: inline-block;
    }
    .btn-primary {
      background: #4CAF50;
      color: white;
    }
    .btn-primary:hover {
      background: #45a049;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
    }
    .btn-secondary {
      background: #667eea;
      color: white;
    }
    .btn-secondary:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
    }
    .btn-tertiary {
      background: #f1f1f1;
      color: #333;
      border: 2px solid #ddd;
    }
    .btn-tertiary:hover {
      background: #e0e0e0;
      border-color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="success-icon">✓</div>
    <h1>Fichier Uploadé avec Succès! 🎉</h1>
    <div class="message">
      <p>Votre fichier a bien été téléchargé et enregistré sur le serveur.</p>
    </div>

    <div class="file-info">
      <p><strong>Statut:</strong> <span style="color: #4CAF50;">✓ Succès</span></p>
      <p><strong>Type:</strong> Image</p>
      <p><strong>Localisation:</strong> /uploads/</p>
    </div>

    <div class="buttons">
      <a href="upload.html" class="button btn-primary">Envoyer un autre fichier</a>
      <a href="index.html" class="button btn-tertiary">Retour à l'accueil</a>
    </div>
  </div>
</body>
</html>
